<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0e10; color: #e4e4e7; font-family: ui-sans-serif, system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #27272a; height: 24px; }
      header .title { font-weight: 600; font-size: 13px; }
      header .agent { color: #71717a; font-size: 12px; }
      header .stop {
        margin-left: auto;
        padding: 4px 10px;
        background: #27272a;
        color: #e4e4e7;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }
      header .stop:hover { background: #3f3f46; }
      #term { position: absolute; top: 41px; left: 0; right: 0; bottom: 0; }
    </style>
  </head>
  <body>
    <header>
      <span class="title" id="chat-title">Chat</span>
      <span class="agent">claude</span>
      <button class="stop" id="chat-stop" type="button" title="Send Ctrl+C">
        Stop
      </button>
    </header>
    <div id="term"></div>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { mount } from "/src/terminal/terminal-runtime.ts";
      import { createLinkHandler } from "/src/terminal/link-handler.ts";
      import { createCloseTabHandler } from "/src/terminal/close-tab-handler.ts";
      import {
        readText,
        writeText,
      } from "@tauri-apps/plugin-clipboard-manager";
      import { emit } from "@tauri-apps/api/event";
      import { getCurrentWebview } from "@tauri-apps/api/webview";

      const linkHandler = createLinkHandler({
        openBrowserTab: (url) => emit("sanctel://open-url", { url }),
      });
      const closeTabHandler = createCloseTabHandler({
        currentTabId: () => getCurrentWebview().label,
        requestCloseTab: (id) => emit("sanctel://close-tab", { id }),
      });

      mount(document.getElementById("term"), {
        linkHandler,
        closeTabHandler,
        clipboard: { readText, writeText },
      });

      // Stop button: send ETX (0x03 / Ctrl+C) to the agent. Same byte path
      // a real Ctrl+C in xterm would take — flows through terminal_write
      // into the PTY → tmux → claude.
      document.getElementById("chat-stop").addEventListener("click", () => {
        invoke("terminal_write", { bytes: [0x03] }).catch((e) =>
          console.error("stop button: terminal_write failed", e),
        );
      });
    </script>
  </body>
</html>
