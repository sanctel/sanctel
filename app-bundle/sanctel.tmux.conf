set -g @resurrect-dir __SANCTEL_RESURRECT_DIR__
set -g @resurrect-capture-pane-contents 'on'
# Restart claude/codex/gemini panes from the snapshot. Sanctel's
# snapshot rewriter normalizes column 9 (pane_current_command) to one
# of these three names whenever a captured agent_session_id is
# available, so resurrect's allowlist hit is what triggers the
# rewritten `<cli> --resume <id>` to actually launch on restore.
# Non-agent panes restore as before (empty shell + scrollback).
set -g @resurrect-processes 'claude codex gemini'
run-shell __SANCTEL_RESURRECT_PLUGIN__
