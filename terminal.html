<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terminal</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0e10; }
      #term { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="term"></div>
    <script type="module">
      import { mount } from "/src/terminal/terminal-runtime.ts";
      import { createLinkHandler } from "/src/terminal/link-handler.ts";
      import {
        readText,
        writeText,
      } from "@tauri-apps/plugin-clipboard-manager";
      import { emit } from "@tauri-apps/api/event";

      // Clicking a URL emits an event to the React shell which routes it
      // through the same code path as "+ new tab" — preserving Space /
      // Profile resolution and the tab store update.
      const linkHandler = createLinkHandler({
        openBrowserTab: (url) => emit("sanctel://open-url", { url }),
      });

      mount(document.getElementById("term"), {
        linkHandler,
        clipboard: { readText, writeText },
      });
    </script>
  </body>
</html>
