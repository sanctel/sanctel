[package]
name = "sanctel"
version = "0.1.0"
edition = "2021"

[lib]
name = "sanctel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sanctel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
parking_lot = "0.12"
